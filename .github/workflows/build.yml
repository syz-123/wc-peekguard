name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build + self-test
        run: |
          chmod +x build.sh
          ./build.sh 0.0.0 "${{ github.run_number }}"

      - name: Consistency self-check
        run: python3 tools/selfcheck.py

      - name: Installer fault injection
        run: ./tools/faultcheck.sh
